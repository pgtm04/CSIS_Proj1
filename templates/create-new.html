<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Revalia&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Create a new room</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Create a new room</h1>
    <form id="create-new" >
    <div class = "input-container">

      <label for="access-code">Create an Access Code:</label>
      <input type="text" id="access-code" name="access-code" required>
    </div>
        <button class = "card2" type="submit">Submit</button>
    </form>
<script src = "https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
    document.getElementById('create-new').addEventListener('submit', function(e) {
        e.preventDefault();
        createNewRoom();
    });
    function createNewRoom() {
        const roomName = document.getElementById('access-code').value.trim();
        if (roomName) {
            socket.emit('create_room', { room_name: roomName });
        }
    }

    socket.on('room_created', function(data) {
        console.log("CREATED")
        if (data.success) {
            localStorage.setItem("currentRoom", data.room);
            window.location.href = "/";
        } else {
            alert(data.message);
        }
    });
</script>

</body>
</html>
