<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Hello!</h1>
    <form action="/" method="POST">
        <label for="message">Message:</label>
        <input type="text" id="message" name="message" required>

        <button type="submit">Submit</button>

        {% if message_history %}
        <div style="margin-top: 20px; color: blue;">
            <h3>Sent!</h3>
            {% for msg in message_history %}
                <p>{{ msg }}</p>
            {% endfor %}
        </div>
        {% endif %}

    </form>

</body>
</html>
