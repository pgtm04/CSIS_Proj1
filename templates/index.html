<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room</title>
</head>
<body>
    <h1>Hello!</h1>
    <form id="chatForm">
        <label for="message">Message:</label>
        <input type="text" id="message" name="message" required>

        <button type="submit">Share</button>

        <div id="message-container" style="margin-top: 20px; color: blue;">
            {% if message_history %}
                {% for msg in message_history %}
                    <p>{{ msg }}</p>
                {% endfor %}
            {% endif %}
        </div>
    </form>
    <form id="fileForm">
      <input type="file" id="myFile" name="filename">
      <button type="submit">Share</button><p></p>
    </form>
    <footer>
        <a  href="/welcome.html">Join a room</a><p></p>
        <a  href="/create-new.html">Create a new secure access room</a>
    </footer>
    <script src = "https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const currentRoom = localStorage.getItem("currentRoom") || "default";
        let deviceId = localStorage.getItem("deviceId");
        socket.on('connect', function() {
            if (localStorage.getItem("deviceId")==="Anonymous" || !deviceId) {
                deviceId = "Device_" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem("deviceId", deviceId);
            }
            socket.emit('join_room', { deviceId: deviceId, room: currentRoom});
        });

        document.getElementById('chatForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('message');

            socket.emit('client_message', { message: input.value });
            input.value = '';
        });
        document.getElementById('fileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('myFile');
            const file = input.files[0];
            const reader = new FileReader();
                reader.onload = function(evt) {
                    socket.emit("upload-file", {file: evt.target.result, name: file.name});
                    input.value = '';
                };
            reader.readAsArrayBuffer(file);
        });

        socket.on('server_response', function(data){
            const container = document.getElementById('message-container');
            const newP = document.createElement('p');
            const parts = data.message.split(': ');
            if (parts.length > 1 && parts[1].startsWith('/')) {
                const sender = parts[0];
                const fileUrl = parts[1];

                newP.appendChild(document.createTextNode(`${sender}: `));

                const link = document.createElement('a');
                link.href = fileUrl;
                link.textContent = "Open File";
                link.target = "_blank";

                newP.appendChild(link);
            } else {
                newP.textContent = data.message;
            }
            container.appendChild(newP)
        });
        socket.on('load_history', function (data){
            if (data.success && data.history) {
                const container = document.getElementById('message-container');
                container.innerHTML = '';
                data.history.forEach(msg => {
                    const newP = document.createElement('p');
                    newP.textContent = msg;
                    container.appendChild(newP)
                })
            }
        })
    </script>

</body>
</html>
