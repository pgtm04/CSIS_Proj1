<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Revalia&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class = grid-container>
    <div class = "left-panel">
    <h1 class="heading" id = "h1"> Home</h1>
        <form class="chatForm" id="chatForm">
            <div class="messageTile">
            <label for="message">Message:</label>
            <div class = "input-container">
                <input type="text" id="message" name="message">
                <button class="card" type="button" id="pasteBtn">
                  <img src="/images/paste1.png" alt="Paste Icon" width="25" height="25">
                </button>
            </div>
            <p></p><input class = "fileDrop" type="file" id="myFile" name="filename">
            </div>

            <p></p><button class = "card2" type="submit">Share</button>

        </form>
    <a  href="/welcome.html">Join a room</a>
    <a  href="/create-new.html">Create a new secure access room</a>
    <button class = "card" type="button" id="clearBtn">Clear Storage</button>
    </div>
    <div id="message-container"></div>

</div>
    <script>
        const DB_NAME = "ShareRoomDB";
        const DB_VERSION = 1;

        function getDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = function(event) {
                    const db = event.target.result;

                    if (!db.objectStoreNames.contains("messages")) {
                        const messages = db.createObjectStore("messages", {
                            keyPath: "id",
                            autoIncrement: true
                        });
                        messages.createIndex("room", "room", { unique: false });
                    }

                    if (!db.objectStoreNames.contains("files")) {
                        const files = db.createObjectStore("files", {
                            keyPath: "id",
                            autoIncrement: true
                        });
                        files.createIndex("room", "room", { unique: false });
                    }
                };

                request.onsuccess = function() {
                    resolve(request.result);
                };

                request.onerror = function() {
                    reject(request.error);
                };
            });
        }

        async function saveMessage(message) {
            const db = await getDB();

            return new Promise((resolve, reject) => {
                const transaction = db.transaction("messages", "readwrite");
                const store = transaction.objectStore("messages");

                const request = store.add(message);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        async function clearRoomMessages(room) {
            const db = await getDB();

            return new Promise((resolve, reject) => {
                const transaction = db.transaction("messages", "readwrite");
                const store = transaction.objectStore("messages");
                const index = store.index("room");
                const request = index.openCursor(IDBKeyRange.only(room));

                request.onsuccess = function() {
                    const cursor = request.result;
                    if (cursor) {
                        cursor.delete();
                        cursor.continue();
                    }
                };

                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject(transaction.error);
                transaction.onabort = () => reject(transaction.error);
            });
        }
    </script>
    <script src = "https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io();
        const currentRoom = localStorage.getItem("currentRoom") || "default";
        let deviceId = localStorage.getItem("deviceId");
        socket.on('connect', async function() {
            if (localStorage.getItem("deviceId")==="Anonymous" || !deviceId) {
                deviceId = "Device_" + Math.floor(1000 + Math.random() * 9000);
                localStorage.setItem("deviceId", deviceId);
            }
            socket.emit('join_room', { deviceId: deviceId, room: currentRoom});
            if(currentRoom!=="default")
            {
                document.getElementById('h1').innerHTML = 'Home: '+ currentRoom;
            }
            else
            {
                document.getElementById('h1').innerHTML = 'Home';

            }
        });
        document.getElementById('message').addEventListener('input', function() {
            if(document.getElementById('message').value.trim().length>0) {
                document.getElementById('myFile').disabled = true;
            }
            else{
                document.getElementById('myFile').disabled = false;

            }
        })
        document.getElementById('myFile').addEventListener('input', function() {
            if(document.getElementById('myFile').files.length>0) {
                document.getElementById('message').disabled = true;
                document.getElementById('pasteBtn').disabled = true;

            }
            else{
                document.getElementById('message').disabled = false;
                document.getElementById('pasteBtn').disabled = false;

            }
        })

        document.getElementById('chatForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if(document.getElementById('message').value.trim().length>0) {
                const input = document.getElementById('message');

                socket.emit('client_message', {message: input.value});
                input.value = '';
            }

            if(document.getElementById('myFile').files.length>0)
            {
                const input = document.getElementById('myFile');
                const file = input.files[0];
                if (!file) return;
                const formData = new FormData();
                formData.append('file', file)
                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.url) {
                        socket.emit("upload-file", { file_url: data.url });
                        input.value = '';
                    }
                })
            }
            document.getElementById('message').disabled = false;
            document.getElementById('myFile').disabled = false;

        });

        document.getElementById("pasteBtn").addEventListener("click", async (e) => {
            e.preventDefault();
            try {
                document.getElementById("message").value = await navigator.clipboard.readText();
                document.getElementById('myFile').disabled = true;

            } catch (err) {
                console.error("Failed to read clipboard contents: ", err);
            }
        });

        socket.on('server_response', async function(data){
            appendMessage(data.message);
            try {
                await saveMessage({
                    room: currentRoom,
                    text: data.message,
                });
            } catch (err) {
                console.error("Failed to save message to IndexedDB:", err);
            }
        });
        socket.on('load_history', async function (data){
            if (data && data.success) {
                    const container = document.getElementById('message-container');
                    container.innerHTML = '';

                if (data.history && Array.isArray(data.history)) {
                    data.history.forEach(msg => appendMessage(msg));
                    try {
                        await clearRoomMessages(data.room);
                        const db = await getDB();
                        const transaction = db.transaction("messages", "readwrite");
                        data.history.forEach(msg => {
                            transaction.objectStore("messages").add({ room: data.room, text: msg });
                        });
                    } catch (err) {
                        console.error("Failed to sync IndexedDB:", err);
                    }
                }
            } else {
                localStorage.setItem("currentRoom", "default");
                document.getElementById('h1').innerHTML = 'Home';
            }
        })
        socket.on('clear_chat', async () => {
            const container = document.getElementById('message-container');
            if (container) {
                container.innerHTML = '';
            }
            try {
                await clearRoomMessages(currentRoom);
            } catch (err) {
                console.error("Failed to clear this room from IndexedDB:", err);
            }
        });
        document.getElementById("clearBtn").addEventListener("click", (e) => {
            e.preventDefault();
            socket.emit('clear_history');
        });

        function appendMessage(msg){
            const container = document.getElementById('message-container');
            const newP = document.createElement('p');
            const parts = msg.split(': ');
            if (parts.length > 1 && /^\/[^\s]+\.[a-zA-Z0-9]{2,4}$/.test(parts[1].trim())) {
                const sender = parts[0];
                const fileUrl = parts[1];

                newP.appendChild(document.createTextNode(`${sender}: `));

                const link = document.createElement('a');
                link.href = fileUrl;
                link.textContent = "Open File";
                link.target = "_blank";

                newP.appendChild(link);
            } else {
                newP.textContent = msg;
            }
            container.appendChild(newP)

        }
        async function getMessages(room) {
            const db = await getDB();

            return new Promise((resolve, reject) => {
                const transaction = db.transaction("messages", "readonly");
                const store = transaction.objectStore("messages");
                const index = store.index("room");

                const request = index.getAll(room);

                request.onsuccess = function() {
                    resolve(request.result);
                };

                request.onerror = function() {
                    reject(request.error);
                };
            });
        }

    </script>

</body>
</html>
