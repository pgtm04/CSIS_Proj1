<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body>
<h1>Join a room</h1>
    <form id="access-code" >
      <label for="user-password">Access Code:</label>
      <input type="text" id="user-password" name="password" required>

        <button type="submit">Submit</button>

      <p id="error-message" style="margin-top: 25px; color: red;"> </p>

    </form>

<a href="/create-new.html">Create a new room</a>
</body>
<script src = "https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    const socket = io();
  document.getElementById('access-code').addEventListener('submit', function(e){
    e.preventDefault();
    const pw = document.getElementById('user-password').value
    if(!localStorage.getItem("deviceId")) {
        localStorage.setItem("deviceId", "Device_" + Math.floor(1000 + Math.random() * 9000));
    }
    socket.emit('join_room', { room: pw });

    socket.on('load_history', function(data) {
        if (data.success) {
            localStorage.setItem("currentRoom", data.room);
            window.location.href = "/";
        } else{
          document.getElementById("error-message").textContent = "No room found"
        }

    });

  })
</script>
</html>
