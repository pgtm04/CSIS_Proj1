<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body>
<h1>Secure Access</h1>
    <form id="access-code" >
      <label for="user-password">Access Code:</label>
      <input type="password" id="user-password" name="password" required>

        <button type="submit">Submit</button>

      <p id="error-message" style="margin-top: 25px; color: red;"> </p>

    </form>

</body>

<script>
  document.getElementById('access-code').addEventListener('submit', function(e){
    e.preventDefault();
    const pw = document.getElementById('user-password').value
    if(pw === 'SECRET'){
        localStorage.setItem("isLoggedIn", "true");
        if(!localStorage.getItem("deviceId")) {
            localStorage.setItem("deviceId", "Device_" + Math.floor(1000 + Math.random() * 9000));
        }
        window.location.href = "/index.html";
    }
    else{
      document.getElementById("error-message").textContent = "Code Incorrect"
    }

  })
</script>
</html>
